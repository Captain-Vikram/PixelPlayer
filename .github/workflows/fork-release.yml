name: 🚀 Build & Publish Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0-fork). Leave blank to auto-generate.'
        required: false
        default: ''

permissions:
  contents: write   # needed to create releases and upload assets

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─── 2. Java Setup ────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ─── 3. Gradle wrapper permissions ────────────────────────────────────────
      # Do NOT use gradle/actions/setup-gradle — it can silently upgrade Gradle
      # past the wrapper version. AGP 8.13.2 requires Gradle ≤9.5.x and breaks
      # on Gradle 9.6+ (InternalProblems API removed). We use ./gradlew directly
      # so the gradle-wrapper.properties distributionUrl (9.5.1) is always used.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ─── 4. Gradle cache ──────────────────────────────────────────────────────
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ─── 5. Android SDK 37 ────────────────────────────────────────────────────
      # ubuntu-latest ships with SDK ≤35/36; compileSdk=37 needs explicit install.
      - name: Install Android SDK 37
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-37" \
            "build-tools;35.0.0" || true

      # ─── 6. Keystore ──────────────────────────────────────────────────────────
      - name: Setup Signing Keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            echo "Decoding signing key from repository secrets..."
            echo "$SIGNING_KEY_BASE64" | base64 --decode > vz-pixelplay.jks
            echo "storePassword=$KEYSTORE_PASSWORD" > keystore.properties
            echo "keyAlias=$KEY_ALIAS" >> keystore.properties
            echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
          else
            echo "No signing secret found. Falling back to temporary local key..."
            keytool -genkey -v -keystore vz-pixelplay.jks \
              -alias pixelplay-fork-key \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass 994273 -keypass 994273 \
              -dname "CN=PixelPlayer Fork, OU=CaptainVikram, O=PixelPlayer, L=World, S=World, C=IN"
            echo "storePassword=994273" > keystore.properties
            echo "keyAlias=pixelplay-fork-key" >> keystore.properties
            echo "keyPassword=994273" >> keystore.properties
          fi

      # ─── 7. Determine release tag ────────────────────────────────────────────
      - name: Determine release tag
        id: release_meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            DATE="$(date -u +%Y%m%d)"
            TAG="v1.0.0-${DATE}-${SHORT_SHA}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "arm64_apk=PixelPlayer-${TAG}-arm64-v8a.apk" >> "$GITHUB_OUTPUT"
          echo "arm32_apk=PixelPlayer-${TAG}-armeabi-v7a.apk" >> "$GITHUB_OUTPUT"
          echo "univ_apk=PixelPlayer-${TAG}-universal.apk" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG"

      # ─── 8. Build ─────────────────────────────────────────────────────────────
      - name: Build release APKs (ABI splits)
        run: |
          ./gradlew :app:assembleRelease -Ppixelplay.enableAbiSplits=true \
            -PAPP_VERSION_NAME="${{ steps.release_meta.outputs.tag }}" \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC" \
            -Pkotlin.compiler.execution.strategy=in-process \
            --max-workers=2 \
            --no-configuration-cache \
            --stacktrace 2>&1 | tee build.log

      # ─── 9. Verify APKs ───────────────────────────────────────────────────────
      - name: Verify APKs
        run: |
          echo "Listing release output directory contents:"
          ls -R app/build/outputs/apk/ || true
          
          # Create warning annotation with all found APKs
          APK_LIST=$(find app/build/outputs/ -name "*.apk" | tr '\n' ' ')
          echo "::warning file=.github,line=15::Generated APKs: $APK_LIST"
          
          ANDROID_SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_SDK_PATH/build-tools" | sort -V | tail -n 1)"
          echo "Using Android SDK Build Tools Version: $BUILD_TOOLS_VERSION"
          
          for apk in app/build/outputs/apk/release/*.apk
          do
            if [ -f "$apk" ]; then
              echo "Verifying $apk ..."
              "$ANDROID_SDK_PATH/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging "$apk" > /dev/null
              "$ANDROID_SDK_PATH/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$apk"
            else
              echo "Error: No APK files found in release directory!"
              # Print full outputs folder structure to check-runs annotations
              ALL_FILES=$(find app/build/outputs/ -type f | tr '\n' ' ')
              echo "::error file=.github,line=29::Output files found: $ALL_FILES"
              exit 1
            fi
          done

      # ─── 10. Rename APKs ──────────────────────────────────────────────────────
      - name: Rename APKs
        run: |
          ARM64_SRC="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          ARM32_SRC="app/build/outputs/apk/release/app-armeabi-v7a-release.apk"
          UNIV_SRC="app/build/outputs/apk/release/app-universal-release.apk"

          ARM64_DST="${{ steps.release_meta.outputs.arm64_apk }}"
          ARM32_DST="${{ steps.release_meta.outputs.arm32_apk }}"
          UNIV_DST="${{ steps.release_meta.outputs.univ_apk }}"

          cp "$ARM64_SRC" "$ARM64_DST" || true
          cp "$ARM32_SRC" "$ARM32_DST" || true
          if [ -f "$UNIV_SRC" ]; then
            cp "$UNIV_SRC" "$UNIV_DST"
          fi

      # ─── 10. Extract latest CHANGELOG section ─────────────────────────────────
      - name: Extract latest changelog entry
        id: changelog
        run: |
          NOTES=$(awk '/^## \[/{if(found) exit; found=1; next} found{print}' CHANGELOG.md | head -60)
          if [ -z "$NOTES" ]; then
            NOTES="See CHANGELOG.md for full release notes."
          fi
          {
            echo "## 📦 Downloads"
            echo ""
            echo "| APK | Architecture | Compatibility |"
            echo "|-----|-------------|---------------|"
            echo "| \`${{ steps.release_meta.outputs.arm64_apk }}\` | \`arm64-v8a\` | **Recommended for most modern phones (64-bit)** |"
            echo "| \`${{ steps.release_meta.outputs.univ_apk }}\` | \`universal\` | **All devices & emulators (works on everything)** |"
            echo "| \`${{ steps.release_meta.outputs.arm32_apk }}\` | \`armeabi-v7a\` | Legacy 32-bit devices |"
            echo ""
            echo "---"
            echo ""
            echo "## 🗒️ Release Notes"
            echo ""
            echo "$NOTES"
            echo ""
            echo "---"
            echo "_PixelPlayer • Commit \`${{ steps.release_meta.outputs.short_sha }}\`_"
          } > release_notes.md

      # ─── 11. Create GitHub Release & Upload APKs ──────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: "PixelPlayer ${{ steps.release_meta.outputs.tag }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            ${{ steps.release_meta.outputs.arm64_apk }}
            ${{ steps.release_meta.outputs.univ_apk }}
            ${{ steps.release_meta.outputs.arm32_apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─── 12. Upload as Actions artifact (backup) ──────────────────────────────
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixelPlayer-${{ steps.release_meta.outputs.tag }}
          path: |
            ${{ steps.release_meta.outputs.arm64_apk }}
            ${{ steps.release_meta.outputs.univ_apk }}
            ${{ steps.release_meta.outputs.arm32_apk }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # ─── 14. Upload build log on failure ──────────────────────────────────────
      - name: Upload build log on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log

      # ─── 15. Print Build Log to Annotations ───────────────────────────────────
      - name: Print Build Log to Annotations
        if: always()
        run: |
          echo "=== BUILD LOG CONTENT ==="
          cat build.log || true
          
          # Create check-run annotations with the build log head and tail
          LOG_HEAD=$(head -n 25 build.log | tr '\n' ' ' | tr '"' "'")
          LOG_TAIL=$(tail -n 45 build.log | tr '\n' ' ' | tr '"' "'")
          echo "::warning file=.github,line=10::LOG HEAD: $LOG_HEAD"
          echo "::error file=.github,line=90::LOG TAIL: $LOG_TAIL"


