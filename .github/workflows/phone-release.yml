name: Build Phone APK (Release)

on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-phone:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK 37
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-37" \
            "build-tools;35.0.0" || true

      - name: Setup Signing Keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            echo "Decoding signing key from repository secrets..."
            echo "$SIGNING_KEY_BASE64" | base64 --decode > vz-pixelplay.jks
            echo "storePassword=$KEYSTORE_PASSWORD" > keystore.properties
            echo "keyAlias=$KEY_ALIAS" >> keystore.properties
            echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
          else
            echo "No signing secret found. Falling back to temporary local key..."
            keytool -genkey -v -keystore vz-pixelplay.jks -alias pixelplay-key -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass 994273 -keypass 994273 \
              -dname "CN=PixelPlay, OU=Dev, O=PixelPlay, L=World, S=World, C=US"
            echo "storePassword=994273" > keystore.properties
            echo "keyAlias=pixelplay-key" >> keystore.properties
            echo "keyPassword=994273" >> keystore.properties
          fi

      - name: Build Phone release APK
        run: |
          ./gradlew :app:assembleRelease -Ppixelplay.enableAbiSplits=true \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC" \
            -Pkotlin.compiler.execution.strategy=in-process \
            --max-workers=2 \
            --no-configuration-cache \
            --stacktrace

      - name: Verify Phone split APKs
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          for apk in \
            app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          do
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging "$apk" >/dev/null
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$apk"
          done

      - name: Upload Phone split APK artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PixelPlay-phone-release-split-apks
          path: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error
          compression-level: 0
