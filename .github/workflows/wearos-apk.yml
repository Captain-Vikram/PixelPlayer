name: Build Wear OS APK (Debug)

on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wear:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK 37
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-37" \
            "build-tools;35.0.0" || true

      - name: Build Wear OS debug APK
        run: |
          ./gradlew :wear:assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC" \
            -Pkotlin.compiler.execution.strategy=in-process \
            --max-workers=2 \
            --no-configuration-cache \
            --stacktrace

      - name: Upload Wear OS APK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PixelPlay-wear-only-debug
          path: wear/build/outputs/apk/debug/*.apk
